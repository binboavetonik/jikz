# CI for the Bitbucket remote (git@bitbucket.org:binboavetonik/jikz.git).
#
# Runs the same gates `prepublishOnly` runs before a release, plus lint and
# the docs build, on every push and pull request. Node 24 matches .nvmrc;
# engines.node says >=18, so the matrix also checks the floor.

image: node:24

definitions:
  caches:
    npm: ~/.npm
  steps:
    - step: &verify
        name: Verify
        caches:
          - npm
        script:
          - node --version
          - npm ci --no-audit --no-fund
          - npm run lint
          # tsc (src + examples) + vite build + declaration post-processing
          - npm run build
          # unit, snapshot, example-gallery and tree-shaking suites
          - npm test
          # publint + arethetypeswrong against the packed tarball
          - npm run check:pkg
          - npm run docs:build
        artifacts:
          - dist/**

pipelines:
  default:
    - step: *verify
  pull-requests:
    '**':
      - parallel:
          - step: *verify
          - step:
              <<: *verify
              name: Verify on Node 18 (engines floor)
              image: node:18
              script:
                - node --version
                - npm ci --no-audit --no-fund
                - npm run build
                - npm test
